<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandOfDraft — كاونترات Mobile Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --void:#06060A; --ink-1:#0B0C11; --ink-2:#111319; --ink-3:#181A22;
  --hair:rgba(237,233,227,.07); --hair-2:rgba(237,233,227,.13);
  --bone:#EDE9E3; --bone-2:#9B98A2; --bone-3:#5E5C66;
  --ember:#C8433C; --ember-glow:rgba(200,67,60,.16);
  --jade:#3E9E7E; --jade-glow:rgba(62,158,126,.16); --gold:#D6B274;
  --r-tank:#4A7BB0; --r-fighter:#B5603C; --r-assassin:#A63F63;
  --r-mage:#6A5DB8; --r-mm:#B99039; --r-sup:#3E8F73;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--void);color:var(--bone);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:14px;line-height:1.7;text-align:center;
  background-image:linear-gradient(rgba(237,233,227,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(237,233,227,.016) 1px,transparent 1px);background-size:64px 64px}
h1,h2,.kufi{font-family:'Noto Kufi Arabic',serif;font-weight:700;letter-spacing:-.2px}
.num,.lat{font-family:'Chakra Petch',monospace;font-variant-numeric:tabular-nums}
::selection{background:var(--ember);color:#fff}

.top{position:sticky;top:0;z-index:50;background:rgba(6,6,10,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top-in{max-width:1120px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:'Noto Kufi Arabic';font-weight:700;font-size:15px;cursor:pointer;border:0;background:none;color:var(--bone)}
.mark{width:20px;height:20px;flex:none;transform:rotate(45deg);background:linear-gradient(135deg,var(--ember),#7a2420);
  box-shadow:0 0 0 1px rgba(214,178,116,.35),0 0 18px var(--ember-glow)}
.nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.nav button{color:var(--bone-2);background:none;border:0;font-family:inherit;font-size:12.5px;font-weight:500;
  padding:6px 11px;border-radius:2px;white-space:nowrap;cursor:pointer;transition:color .16s var(--ease)}
.nav button:hover{color:var(--bone);background:var(--ink-2)}
.nav button.on{color:var(--bone)}
.nav button.on::after{content:'';display:block;height:1px;background:var(--ember);margin-top:5px}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px 90px;text-align:center}
.eyebrow{font-family:'Chakra Petch';font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-3);
  display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0 12px}
.eyebrow::before,.eyebrow::after{content:'';flex:1;height:1px;background:var(--hair)}
.eyebrow:first-child{margin-top:18px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dot.red{background:var(--ember);animation:pulseRed 1.6s ease-in-out infinite}
.dot.green{background:var(--jade);animation:pulseGreen 1.6s ease-in-out infinite}
@keyframes pulseRed{0%,100%{opacity:.35;box-shadow:0 0 0 0 rgba(200,67,60,.6)}50%{opacity:1;box-shadow:0 0 7px 2px rgba(200,67,60,.5)}}
@keyframes pulseGreen{0%,100%{opacity:.35;box-shadow:0 0 0 0 rgba(62,158,126,.6)}50%{opacity:1;box-shadow:0 0 7px 2px rgba(62,158,126,.5)}}

.hero-band{padding:44px 0 24px;border-bottom:1px solid var(--hair);position:relative;overflow:hidden;text-align:center}
.hero-band::before{content:'';position:absolute;inset:-40% 30% auto -20%;height:340px;
  background:radial-gradient(closest-side,var(--ember-glow),transparent 70%);pointer-events:none}
.hero-band h1{font-size:clamp(24px,6vw,38px);line-height:1.25;margin:0 auto 9px;position:relative}
.hero-band h1 em{font-style:normal;color:var(--ember)}
.lede{color:var(--bone-2);max-width:46ch;font-size:13.5px;margin:0 auto 20px;position:relative}
.searchbox{position:relative;max-width:440px;margin:0 auto}
.searchbox input{width:100%;background:var(--ink-1);border:1px solid var(--hair-2);padding:14px 44px 14px 15px;
  color:var(--bone);font-family:inherit;font-size:14.5px;border-radius:3px;transition:.18s var(--ease);text-align:center}
.searchbox input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 4px var(--ember-glow)}
.searchbox input::placeholder{color:var(--bone-3)}
.searchbox .ico{position:absolute;top:50%;right:15px;transform:translateY(-50%);color:var(--bone-3)}
.live{margin-top:8px;background:var(--ink-1);border:1px solid var(--hair);border-radius:3px;overflow:hidden;max-height:280px;overflow-y:auto}
.live div{padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-size:12.5px}
.live div:hover{background:var(--ink-2)}
.live .lat{color:var(--bone-3);font-size:10.5px}
.patchbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:20px;position:relative}
.pill{font-family:'Chakra Petch';font-size:10.5px;font-weight:600;letter-spacing:.04em;border:1px solid var(--hair-2);
  padding:4px 10px;border-radius:2px;color:var(--bone-2);background:none;cursor:pointer}
.pill.gold{border-color:rgba(214,178,116,.4);color:var(--gold)}
.pill.up{border-color:rgba(62,158,126,.4);color:var(--jade)}
.pill.down{border-color:rgba(200,67,60,.4);color:var(--ember)}

.roles{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;justify-content:center}
.rbtn{background:var(--ink-1);border:1px solid var(--hair);color:var(--bone-2);padding:7px 13px;border-radius:2px;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.16s var(--ease)}
.rbtn:hover{border-color:var(--hair-2);color:var(--bone)}
.rbtn.on{background:var(--ink-3);color:var(--bone);border-color:var(--rc,var(--hair-2))}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px;justify-content:center}
.hcard{cursor:pointer;text-align:center;background:none;border:0;padding:0;font-family:inherit;color:inherit}
.face{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid var(--hair);
  background:radial-gradient(120% 90% at 50% 8%,color-mix(in srgb,var(--rc) 34%,transparent),transparent 62%),
  linear-gradient(180deg,var(--ink-2),var(--ink-1));display:grid;place-items:center;transition:.2s var(--ease)}
.face b{font-family:'Chakra Petch';font-size:22px;font-weight:700;color:rgba(237,233,227,.34)}
.face img,.mu-face img,.avatar img,.slot img,.pface img,.qface img,.mini .face img{
  width:100%;height:100%;object-fit:cover;display:block}
.face::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:var(--rc);opacity:.75}
.hcard:hover .face{border-color:var(--rc);transform:translateY(-3px)}
.hcard:hover .face b{color:var(--bone)}
.tierbadge{position:absolute;top:5px;inset-inline-start:5px;font-family:'Chakra Petch';font-size:9px;font-weight:700;
  padding:1px 5px;background:rgba(6,6,10,.8);border:1px solid var(--hair-2);color:var(--gold)}
.covbadge{position:absolute;top:5px;inset-inline-end:5px;width:6px;height:6px;border-radius:50%;background:var(--jade)}
.hname{font-size:11px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrole{font-family:'Chakra Petch';font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3)}

.card{background:var(--ink-1);border:1px solid var(--hair);padding:12px}
.splash{position:relative;margin-top:16px;border:1px solid var(--hair);overflow:hidden;text-align:center;
  background:linear-gradient(105deg,var(--ink-2) 0%,var(--ink-1) 55%,#0a0a0f 100%)}
.splash::before{content:'';position:absolute;inset:0;
  background:radial-gradient(closest-side at 50% 40%,color-mix(in srgb,var(--rc) 26%,transparent),transparent 72%)}
.splash-in{position:relative;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:9px}
.splash .avatar{width:74px;height:74px;flex:none;border:1px solid var(--hair-2);display:grid;place-items:center;
  background:linear-gradient(180deg,var(--ink-3),var(--ink-1))}
.splash .avatar b{font-family:'Chakra Petch';font-size:30px;color:var(--rc)}
.splash h2{margin:0;font-size:23px}
.lat-name{font-family:'Chakra Petch';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3)}
.meta-row{display:flex;flex-wrap:wrap;gap:13px;justify-content:center;margin-top:2px;font-size:11px;color:var(--bone-2)}
.meta-row b{color:var(--bone);font-weight:600}

.verdict{border:1px solid var(--hair);background:var(--ink-1);padding:13px 15px;margin-top:14px;font-size:13px;color:var(--bone-2)}
.verdict b{color:var(--bone)}
.notesgrid{display:grid;gap:9px;margin-top:11px}
@media(min-width:640px){.notesgrid.two{grid-template-columns:1fr 1fr}.notesgrid.three{grid-template-columns:1fr 1fr 1fr}}
.notes-title{font-family:'Chakra Petch';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.notes-title.jade{color:var(--jade)}.notes-title.ember{color:var(--ember)}.notes-title.neutral{color:var(--bone-3)}
.notes-list{margin:0;padding:0;list-style:none}
.notes-list li{display:flex;gap:7px;font-size:11.5px;color:var(--bone-2);padding:3.5px 0;justify-content:center}
.notes-list li i{font-style:normal;flex:none;margin-top:1px}
.build{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.item{background:var(--ink-1);border:1px solid var(--hair);padding:10px 11px;position:relative}
.item .ord{position:absolute;top:8px;inset-inline-end:10px;font-family:'Chakra Petch';font-size:9.5px;color:var(--bone-3)}
.item .nm{font-size:12px;font-weight:600}
.item .pr{font-family:'Chakra Petch';font-size:10px;color:var(--gold);margin-top:1px}
.item .rs{font-size:10.5px;color:var(--bone-3);margin-top:5px;line-height:1.6}
.skillgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}
.skillbox{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--hair-2);background:var(--ink-2);
  font-family:'Chakra Petch';font-size:10px}
.skillbox.on{color:var(--gold);font-weight:700}
.skillbox:not(.on){color:var(--bone-3)}
.combo{border:1px solid var(--hair);background:var(--ink-1);padding:11px}
.combo .kind{font-family:'Chakra Petch';font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-3)}
.combo .steps{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.combo .steps span.slot{border:1px solid var(--hair-2);background:var(--ink-2);padding:4px 8px;font-family:'Chakra Petch';font-size:10px}
.combo .steps .arrow{color:var(--bone-3)}

.matchup{background:var(--ink-1);border:1px solid var(--hair);padding:13px 14px;margin-bottom:8px}
.mu-head{display:flex;align-items:center;gap:10px}
.mu-face{width:42px;height:42px;flex:none;border:1px solid var(--hair);display:grid;place-items:center;
  background:linear-gradient(180deg,var(--ink-3),var(--ink-1));position:relative;cursor:pointer}
.mu-face b{font-family:'Chakra Petch';font-size:16px;color:var(--rc)}
.mu-rank{position:absolute;top:-6px;inset-inline-start:-6px;width:16px;height:16px;background:var(--void);
  border:1px solid var(--hair-2);display:grid;place-items:center;font-family:'Chakra Petch';font-size:9px;color:var(--bone-2)}
.mu-name{font-size:13.5px;font-weight:600;cursor:pointer}
.mu-reason{font-size:11px;color:var(--bone-2);margin-top:1px}
.mu-delta{margin-inline-start:auto;text-align:end;flex:none}
.mu-delta .v{font-family:'Chakra Petch';font-size:18px;font-weight:700;color:var(--jade)}
.mu-delta .l{font-family:'Chakra Petch';font-size:8.5px;letter-spacing:.14em;color:var(--bone-3);text-transform:uppercase}
.proof{display:inline-block;font-family:'Chakra Petch';font-size:8.5px;letter-spacing:.1em;padding:1px 6px;
  border:1px solid var(--hair-2);color:var(--bone-3);margin-inline-start:6px;vertical-align:middle;text-transform:uppercase}
.proof.real{border-color:rgba(62,158,126,.45);color:var(--jade)}
.tug{margin-top:12px;height:22px;position:relative}
.tug .line{position:absolute;inset:10px 0 auto 0;height:2px;background:var(--hair-2)}
.tug .fill{position:absolute;top:10px;height:2px;background:linear-gradient(90deg,var(--jade),rgba(62,158,126,.15));transition:width .9s var(--ease)}
.tug .mid{position:absolute;top:4px;left:50%;width:1px;height:14px;background:var(--hair-2)}
.tug .end{position:absolute;top:5px;width:12px;height:12px;transform:rotate(45deg);border:1px solid var(--hair-2);background:var(--void)}
.tug .end.a{right:0}.tug .end.b{left:0}
.tug .tick{position:absolute;top:16px;font-family:'Chakra Petch';font-size:8.5px;color:var(--bone-3)}
.tug .tick.r{right:16px}.tug .tick.l{left:16px}

.pn{border:1px solid var(--hair);background:var(--ink-1);padding:12px 14px;margin-bottom:8px}
.pn.buff{border-inline-start:2px solid var(--jade)}
.pn.nerf{border-inline-start:2px solid var(--ember)}
.pn.adjust{border-inline-start:2px solid var(--gold)}
.pn .kind{font-family:'Chakra Petch';font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.pn.buff .kind{color:var(--jade)}.pn.nerf .kind{color:var(--ember)}.pn.adjust .kind{color:var(--gold)}
.pn .ttl{font-size:13px;font-weight:600;margin-top:3px}
.pn .dt{font-size:11.5px;color:var(--bone-2);margin-top:4px}

.empty{text-align:center;color:var(--bone-3);font-size:12px;padding:20px 12px;line-height:1.8}
.note{font-size:10.5px;color:var(--bone-3);line-height:1.8;margin-top:16px;border-top:1px solid var(--hair);padding-top:11px}
.backbtn{background:none;border:0;color:var(--bone-3);font-family:inherit;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;margin:18px auto 0}
.backbtn:hover{color:var(--bone)}

.tierrow{display:flex;gap:11px;border:1px solid var(--hair);background:var(--ink-1);padding:10px;margin-bottom:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.tierrow .t{width:42px;flex:none;text-align:center;font-family:'Chakra Petch';font-size:19px;font-weight:700}
.tierrow .t small{display:block;font-size:8px;letter-spacing:.14em;color:var(--bone-3)}
.strip{display:flex;gap:8px;overflow-x:auto;justify-content:center;flex-wrap:wrap}
.mini{flex:none;width:64px;text-align:center;cursor:pointer;background:none;border:0;font-family:inherit;color:inherit}
.mini .face{aspect-ratio:1}
.mini .face b{font-size:16px}
.mini .n{font-size:9.5px;margin-top:4px;color:var(--bone-2)}

.board{max-width:520px;margin:14px auto 0}
.tvswrap{display:grid;gap:11px;max-width:640px;margin:14px auto 0}
@media(min-width:640px){.tvswrap{grid-template-columns:1fr 1fr}}
.tvs{background:var(--ink-1);border:1px solid var(--hair);padding:12px}
.tvs.ally{border-top:2px solid var(--jade)}
.tvs.enemy{border-top:2px solid var(--ember)}
.tvs h4{margin:0 0 10px;font-size:11.5px;font-family:'Chakra Petch';letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone-2);display:flex;justify-content:center;gap:8px}
.vsbar{max-width:520px;margin:14px auto 0;height:8px;display:flex;overflow:hidden;border:1px solid var(--hair-2)}
.vsfill{height:100%;transition:width .6s var(--ease)}
.vsfill.a{background:var(--jade)}
.vsfill.b{background:var(--ember)}
.vslabels{max-width:520px;margin:6px auto 0;display:flex;justify-content:space-between;
  font-family:'Chakra Petch';font-size:10.5px;color:var(--bone-2)}
.pairrow{display:flex;align-items:center;gap:10px;background:var(--ink-1);border:1px solid var(--hair);
  padding:9px 12px;margin:0 auto 6px;max-width:560px;text-align:start}
.pface{width:30px;height:30px;flex:none;border:1px solid var(--hair-2);display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 8%,color-mix(in srgb,var(--rc) 34%,transparent),var(--ink-2));cursor:pointer}
.pface b{font-family:'Chakra Petch';font-size:12px;color:var(--rc)}
.pface.dim{opacity:.5}
.parrow{color:var(--bone-3);font-size:11px;flex:none}
.ptext{flex:1;min-width:0}
.ptext b{font-size:12px;cursor:pointer}
.ptext p{margin:2px 0 0;font-size:10.5px;color:var(--bone-2)}
.pscore{font-family:'Chakra Petch';font-size:13px;font-weight:700;color:var(--jade);flex:none}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border:1px dashed var(--hair-2);display:grid;place-items:center;background:var(--ink-2);
  cursor:pointer;transition:.16s var(--ease);position:relative}
.slot:hover{border-color:var(--bone-3)}
.slot.filled{border-style:solid;border-color:var(--hair-2);
  background:radial-gradient(120% 90% at 50% 6%,color-mix(in srgb,var(--rc) 32%,transparent),var(--ink-1))}
.slot b{font-family:'Chakra Petch';font-size:15px;color:var(--rc)}
.slot .plus{color:var(--bone-3);font-size:16px}
.slot .x{position:absolute;top:2px;left:2px;font-size:9px;color:var(--bone-3)}
.cta{width:100%;max-width:420px;margin:14px auto 0;display:block;background:linear-gradient(180deg,#D24C43,#98302B);
  color:#fff;border:0;padding:13px;font-family:'Noto Kufi Arabic';font-weight:700;font-size:13.5px;cursor:pointer;
  box-shadow:0 8px 26px rgba(200,67,60,.24);transition:.18s var(--ease)}
.cta:hover{transform:translateY(-1px)}
.sugg{background:var(--ink-1);border:1px solid var(--hair);padding:12px 13px;margin-bottom:7px;
  display:flex;gap:11px;align-items:center;text-align:start;max-width:520px;margin-inline:auto}
.sring{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative}
.sring::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--ink-1)}
.sring span{position:relative;font-family:'Chakra Petch';font-size:13px;font-weight:700}
.sugg .info{flex:1;min-width:0}
.sugg .info b{font-size:13px;font-weight:700;cursor:pointer}
.sugg .info p{margin:2px 0 0;font-size:11px;color:var(--bone-2)}
.pickpanel{max-width:520px;margin:10px auto 0;background:var(--ink-1);border:1px solid var(--hair);padding:12px}
.pickpanel input{width:100%;background:var(--ink-2);border:1px solid var(--hair-2);padding:8px 10px;color:var(--bone);
  font-family:inherit;font-size:12.5px;text-align:center;margin-bottom:9px}

.qbackdrop{position:fixed;inset:0;background:rgba(6,6,10,.75);z-index:60;animation:qfade .15s var(--ease)}
.qcard{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(88vw,300px);
  max-height:80vh;overflow-y:auto;background:var(--ink-1);border:1px solid var(--hair-2);padding:14px;
  text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.55);animation:qpop .18s var(--ease)}
@keyframes qfade{from{opacity:0}}
@keyframes qpop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
@keyframes qslide{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (max-width:480px){
  .qcard{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-width:100%;
    border-radius:14px 14px 0 0;max-height:78vh;animation:qslide .2s var(--ease)}
}
.qclose{position:absolute;top:8px;left:8px;background:none;border:0;color:var(--bone-3);font-size:13px;cursor:pointer;padding:4px}
.qclose:hover{color:var(--bone)}
.qhead{display:flex;flex-direction:column;align-items:center;gap:7px}
.qface{width:42px;height:42px;flex:none;border:1px solid var(--hair-2);display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 8%,color-mix(in srgb,var(--rc) 34%,transparent),var(--ink-2))}
.qface b{font-family:'Chakra Petch';font-size:17px;color:var(--rc)}
.qname{font-size:14px;font-weight:700}
.qlane{font-size:11px;color:var(--bone-3);font-weight:500}
.qrole{font-size:10px;color:var(--bone-3);margin-top:1px}
.qlbl{display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Chakra Petch';font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--bone-3);margin:13px 0 6px}
.qmatch{display:flex;justify-content:center;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--hair)}
.qmatch:last-of-type{border-bottom:0}
.qmatch button{background:none;border:0;color:var(--bone-2);font-family:inherit;font-size:12px;cursor:pointer}
.qmatch button:hover{color:var(--bone)}
.qmatch .qd{font-family:'Chakra Petch';font-size:11px;color:var(--jade);flex:none}
.qinfo{width:100%;margin-top:14px;background:none;border:1px solid var(--ember);color:var(--bone);padding:9px;
  font-family:'Noto Kufi Arabic';font-weight:700;font-size:12px;cursor:pointer;transition:.16s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:6px}
.qinfo:hover{background:var(--ember-glow)}
.qinfo::before{content:'ⓘ';color:var(--gold)}

.loginbox{max-width:320px;margin:60px auto;background:var(--ink-1);border:1px solid var(--hair-2);padding:22px}
.loginbox input{width:100%;background:var(--ink-2);border:1px solid var(--hair-2);padding:10px 12px;color:var(--bone);
  font-family:inherit;font-size:13px;text-align:center;margin-bottom:10px}
.loginbox .err{color:var(--ember);font-size:11.5px;margin-top:8px}
.warnbox{max-width:640px;margin:14px auto;border:1px solid rgba(214,178,116,.35);background:rgba(214,178,116,.06);
  padding:12px 14px;font-size:11.5px;color:var(--bone-2);text-align:start}
.atable{max-width:760px;margin:0 auto;border:1px solid var(--hair)}
.arow{display:grid;grid-template-columns:1fr 90px 100px 60px 90px;gap:8px;align-items:center;padding:8px 10px;
  border-bottom:1px solid var(--hair);font-size:12px}
.arow.ahead{font-family:'Chakra Petch';font-size:9.5px;color:var(--bone-3);text-transform:uppercase}
.arow input,.arow select{width:100%;background:var(--ink-2);border:1px solid var(--hair-2);color:var(--bone);
  font-family:inherit;font-size:11.5px;padding:5px 6px;text-align:center}
.abtn{background:none;border:1px solid var(--hair-2);color:var(--bone-2);padding:5px 9px;font-size:11px;cursor:pointer}
.abtn:hover{color:var(--bone);border-color:var(--bone-3)}
.abtn.del{border-color:rgba(200,67,60,.4);color:var(--ember)}
.addform{max-width:520px;margin:14px auto 0;background:var(--ink-1);border:1px solid var(--hair);padding:14px;text-align:start}
.addform label{display:block;font-size:10.5px;color:var(--bone-3);margin:9px 0 4px}
.addform input,.addform select{width:100%;background:var(--ink-2);border:1px solid var(--hair-2);color:var(--bone);
  font-family:inherit;font-size:12.5px;padding:8px 10px}

function renderHero(){
  const h = HEROES[heroSlug];
  const countersFor = COUNTERS.filter(c=>c[0]===heroSlug).sort((a,b)=>b[2]-a[2]);
  const usedAgainst  = COUNTERS.filter(c=>c[1]===heroSlug).sort((a,b)=>b[2]-a[2]);
  const hasFullInfo = !!(h.overview || h.notes || h.build || h.skillOrder || h.combos);

  const matchCard = (entry, opp, rankIndex, headline) => {
    const score = entry[2], delta = entry[3], reason = entry[4];
    const pct = delta!=null? 50+delta*8 : 50+(score-50)*0.6;
    return `<div class="matchup" style="--rc:${rc(opp)}">
      <div class="mu-head">
        <div class="mu-face" data-quick="${opp}">${rankIndex!=null?`<span class="mu-rank num">${rankIndex+1}</span>`:''}${avatarInner(opp)}</div>
        <div>
          <div class="mu-name" data-quick="${opp}">${headline}
            <span class="proof ${delta!=null?'real':''}">${delta!=null?'مقاس':'تحليلي'}</span></div>
          <div class="mu-reason">${reason}</div>
        </div>
        <div class="mu-delta"><div class="v num">${delta!=null?'+'+delta.toFixed(1):score}</div>
          <div class="l">${delta!=null?'نقطة فوز':'من ١٠٠'}</div></div>
      </div>
      <div class="tug"><div class="line"></div><div class="fill" style="width:${pct}%"></div>
        <div class="mid"></div><div class="end a"></div><div class="end b"></div>
        <div class="tick r lat">${entry[1].toUpperCase()}</div><div class="tick l lat">${entry[0].toUpperCase()}</div></div>

  };

  const notesRow = (title,tone,items)=> !items||!items.length? '':`
    <div class="card"><div class="notes-title ${tone}">${title}</div><ul class="notes-list">

  <div class="splash" style="--rc:${rc(heroSlug)}">
    <div class="splash-in">
      <div class="avatar">${avatarInner(heroSlug)}</div>

        ${h.tier?`<span>التير <b>${h.tier}</b></span>`:''}

      </div>
    </div>
  </div>

  ${hasFullInfo? `
    ${h.overview?`<div class="verdict"><b>نبذة:</b> ${h.overview}</div>`:''}
    ${h.notes? `<div class="notesgrid two">
      ${notesRow('نقاط القوة','jade',h.notes.strength)}
      ${notesRow('نقاط الضعف','ember',h.notes.weakness)}
      ${notesRow('أفضل وقت لاختياره','neutral',h.notes.pick_when)}
      ${notesRow('تجنّب اختياره حين','neutral',h.notes.avoid_when)}
    </div>` : ''}
    ${h.build? `<div class="eyebrow">البيلد الأساسي</div>
    <div class="build">${h.build.items.map((it,i)=>`
      <div class="item"><span class="ord num">${i+1}</span><div class="nm">${it.n}</div>
        <div class="pr num">${it.p.toLocaleString()}</div><div class="rs">${it.r}</div></div>`).join('')}</div>
    <p class="note" style="border:0;margin-top:9px">الشارة: <b style="color:var(--bone)">${h.build.emblem}</b> —
      التعويذة: <b style="color:var(--bone)">${h.build.spell}</b> (البديل: ${h.build.alt})<br>${h.build.summary}</p>` : ''}
    ${h.skillOrder? `<div class="eyebrow">ترتيب تطوير المهارات</div>

      <div class="skillgrid">${Array.from({length:15},(_,i)=>i+1).map(l=>`
        <div class="skillbox ${h.skillOrder.map[l]?'on':''}">${h.skillOrder.map[l]||l}</div>`).join('')}</div>

    ${h.combos&&h.combos.length? `<div class="eyebrow">أفضل الكومبوهات</div>

function compareTeams(a, b){
  const A = a.filter(Boolean), B = b.filter(Boolean);
  let scoreA=0, scoreB=0;
  const winsA=[], winsB=[];
  A.forEach(x=> B.forEach(y=>{
    const xy = COUNTERS.find(c=>c[0]===y && c[1]===x);   // x يقهر y
    if(xy){ scoreA += xy[2]; winsA.push({w:x, l:y, score:xy[2], reason:xy[4]}); }
    const yx = COUNTERS.find(c=>c[0]===x && c[1]===y);   // y يقهر x
    if(yx){ scoreB += yx[2]; winsB.push({w:y, l:x, score:yx[2], reason:yx[4]}); }
  }));
  winsA.sort((p,q)=>q.score-p.score); winsB.sort((p,q)=>q.score-p.score);
  return {scoreA, scoreB, winsA, winsB, pairs:A.length*B.length};
}

function renderDraft(){
  const board = (team, key) => `<div class="tvs ${key==='a'?'ally':'enemy'}">
    <h4>${key==='a'?'الفريق الأول':'الفريق الثاني'} <span class="num">${team.filter(Boolean).length}/5</span></h4>
    <div class="slots">${team.map((s,i)=> s
      ? `<div class="slot filled" style="--rc:${rc(s)}" data-slot="${key}:${i}">${avatarInner(s)}<span class="x">✕</span></div>`
      : `<div class="slot" data-slot="${key}:${i}"><span class="plus">+</span></div>`).join('')}</div></div>`;

  let resultHTML = '';
  if(compareResult){
    const {scoreA, scoreB, winsA, winsB, pairs} = compareResult;
    const total = scoreA+scoreB;
    const pctA = total? Math.round(scoreA/total*100) : 50;
    const verdict = scoreA>scoreB? 'الفريق الأول أفضل' : scoreB>scoreA? 'الفريق الثاني أفضل' : 'الفريقان متعادلان تقريباً';
    const pairRow = (p, winnerIsA) => `<div class="pairrow" style="--rc:${rc(p.w)}">
      <div class="pface" data-quick="${p.w}">${avatarInner(p.w)}</div>
      <span class="parrow">يقهر ›</span>
      <div class="pface dim" data-quick="${p.l}">${avatarInner(p.l)}</div>
      <div class="ptext"><b data-quick="${p.w}">${HEROES[p.w].ar}</b> ضد <b data-quick="${p.l}">${HEROES[p.l].ar}</b><p>${p.reason}</p></div>
      <span class="pscore">${p.score}</span></div>`;

    resultHTML = `
    <div class="eyebrow">${dot(scoreA>=scoreB?'green':'red')} نتيجة المقارنة</div>
    <div class="verdict" style="max-width:520px;margin-inline:auto"><b>${verdict}</b>
      ${total? ` — بفارق ${Math.abs(scoreA-scoreB)} نقطة تقريبية` : ''}</div>
    <div class="vsbar"><div class="vsfill a" style="width:${pctA}%"></div><div class="vsfill b" style="width:${100-pctA}%"></div></div>
    <div class="vslabels"><span>الفريق الأول · ${scoreA}</span><span>الفريق الثاني · ${scoreB}</span></div>
    ${pairs===0? `<p class="empty">اختر بطلاً واحداً على الأقل في كل فريق.</p>` :
      (!winsA.length && !winsB.length)? `<p class="empty">لا توجد مواجهات موثَّقة بين هذين الفريقين بعد — جرّب أبطالاً آخرين.</p>` : `
      ${winsA.length? `<div class="eyebrow" style="margin-top:20px">لماذا الفريق الأول أفضل</div>${winsA.map(p=>pairRow(p,true)).join('')}`:''}
      ${winsB.length? `<div class="eyebrow" style="margin-top:20px">لماذا الفريق الثاني أفضل</div>${winsB.map(p=>pairRow(p,false)).join('')}`:''}
    `}
    <p class="note">المقارنة مبنية فقط على مواجهات كاونتر موثَّقة بين أبطال الفريقين — لا تخمين.</p>`;
  }

  return `
  <div class="eyebrow">احسب أفضل اختيار</div>
  <p class="lede" style="margin:0 auto 10px">اختر تشكيلة كل فريق (حتى ٥)، وشاهد من الأفضل والأسباب.</p>
  <div class="tvswrap">${board(teamA,'a')}${board(teamB,'b')}</div>

function openQuick(slug){ quickSlug = slug; renderQuick(); }
function closeQuick(){ quickSlug = null; renderQuick(); }

function renderQuick(){
  const el = document.getElementById('quickpop');
  if(!quickSlug){ el.innerHTML=''; return; }
  const h = HEROES[quickSlug];
  const beatenBy = COUNTERS.filter(c=>c[0]===quickSlug).sort((a,b)=>b[2]-a[2]).slice(0,5);
  const beats    = COUNTERS.filter(c=>c[1]===quickSlug).sort((a,b)=>b[2]-a[2]).slice(0,5);

  const row = c => {
    const opp = c[1]===quickSlug? c[0] : c[1];
    return `<div class="qmatch"><button data-quick="${opp}">${HEROES[opp].ar}</button>
      <span class="qd num">${c[3]!=null? '+'+c[3].toFixed(1) : c[2]}</span></div>`;
  };

  el.innerHTML = `
    <div class="qbackdrop" data-qclose="1"></div>
    <div class="qcard" style="--rc:${rc(quickSlug)}">
      <button class="qclose" data-qclose="1">✕</button>
      <div class="qhead">
        <div class="qface">${avatarInner(quickSlug)}</div>
        <div class="qname">${h.ar} <span class="qlane">(${h.lane})</span></div>
        <div class="qrole lat">${ROLES[h.role]} · ${quickSlug.toUpperCase()}</div>
      </div>
      ${beatenBy.length? `<div class="qlbl">${dot('red')} من يقهره</div>${beatenBy.map(row).join('')}` : ''}
      ${beats.length? `<div class="qlbl">${dot('green')} يُستخدم ضد</div>${beats.map(row).join('')}` : ''}
      ${!beatenBy.length && !beats.length? `<p class="empty" style="padding:16px 0 4px">لا توجد بيانات كافية بعد.</p>` : ''}
      <button class="qinfo" data-qopenfull="${quickSlug}">معلومات كاملة</button>
    </div>`;

  el.querySelectorAll('[data-qclose]').forEach(x=>x.addEventListener('click', closeQuick));
  el.querySelectorAll('[data-quick]').forEach(x=>x.addEventListener('click', ()=>openQuick(x.dataset.quick)));
  const openBtn = el.querySelector('[data-qopenfull]');
  if(openBtn) openBtn.addEventListener('click', ()=>{ const s=openBtn.dataset.qopenfull; closeQuick(); go('hero', s); });
}

async function uploadHeroImage(file, slug){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${slug}.${ext}`;
  const { error: upErr } = await sb.storage.from('hero-images').upload(path, file, { upsert: true, cacheControl: '3600' });
  if(upErr) throw upErr;
  const { data } = sb.storage.from('hero-images').getPublicUrl(path);
  return data.publicUrl + '?v=' + Date.now(); // كسر ذاكرة التخزين المؤقت عند استبدال صورة موجودة
}

function bindAdmin(){
  const loginBtn = document.getElementById('aLoginBtn');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    const u=document.getElementById('au').value.trim();
    const p=document.getElementById('ap').value.trim();
    loginBtn.disabled=true; loginBtn.textContent='جارٍ التحقّق…';
    if(DB_ENABLED){
      const { error } = await sb.auth.signInWithPassword({ email:u, password:p });
      if(error) admin.err = (error.message||'بيانات الدخول غير صحيحة') + (error.message? ' (Supabase)':''); else { admin.loggedIn=true; admin.err=''; }
    }else{
      if(u===ADMIN_USER && p===ADMIN_PIN){ admin.loggedIn=true; admin.err=''; }
      else admin.err='بيانات الدخول غير صحيحة.';
    }
    render();
  });
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
    if(DB_ENABLED) await sb.auth.signOut();
    admin.loggedIn=false; render();
  });

  const bulkBtn = document.getElementById('bulkUploadBtn');
  if(bulkBtn) bulkBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('bulkImg');
    const status = document.getElementById('bulkStatus');
    const files = Array.from(input.files||[]);
    if(!files.length){ alert('اختر صوراً أولاً.'); return; }
    bulkBtn.disabled = true;
    const matched=[], unmatched=[];
    for(let i=0;i<files.length;i++){
      const file = files[i];
      status.textContent = `جارٍ الرفع… (${i+1}/${files.length}) ${file.name}`;
      const base = file.name.split('.')[0]; // ما قبل أول نقطة — يتجاهل أي امتدادات مكرَّرة مثل .webp.webp
      const slug = base.toLowerCase().replace(/[^a-z0-9]/g,'');
      if(!HEROES[slug]){ unmatched.push(file.name); continue; }
      try{
        const url = await uploadHeroImage(file, slug);
        HEROES[slug].img = url;
        const { error } = await sb.from('heroes').update({img:url}).eq('slug', slug);
        if(error) throw error;
        matched.push(HEROES[slug].ar);
      }catch(e){ unmatched.push(`${file.name} (${e.message||'خطأ رفع'})`); }
    }
    bulkBtn.disabled = false;
    input.value = '';
    admin.bulkMsg = `<b style="color:var(--jade)">نجح رفع ${matched.length} صورة.</b>` +
      (unmatched.length? `<br><span style="color:var(--ember)">لم تُطابق أو فشلت (${unmatched.length}): ${unmatched.join('، ')}</span>` : '');
    render();
  });

  const addBtn = document.getElementById('addBtn');
  if(addBtn) addBtn.addEventListener('click', async ()=>{
    const en=document.getElementById('nEn').value.trim();
    const ar=document.getElementById('nAr').value.trim();
    const role=document.getElementById('nRole').value;
    const lane=document.getElementById('nLane').value.trim() || LANE_DEFAULT[role];
    const img=document.getElementById('nImg').value.trim() || null;
    const tier=document.getElementById('nTier').value || null;
    if(!en||!ar){ alert('أدخل الاسمين بالإنجليزية والعربية.'); return; }
    const slug = en.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!slug){ alert('اسم إنجليزي غير صالح.'); return; }
    if(HEROES[slug]){ alert('هذا المعرّف موجود مسبقاً: '+slug); return; }
    const pop = POP_DEFAULT;
    HEROES[slug] = {ar, role, lane, tier, img, pop};
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('heroes').insert({slug, ar, role, lane, tier, img, pop});
      if(error) alert('حُفظ محلياً لكن فشل الحفظ في قاعدة البيانات: '+error.message);
    }
  });

  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click', ()=>{ admin.editSlug=el.dataset.edit; render(); }));
  document.querySelectorAll('[data-canceledit]').forEach(el=>el.addEventListener('click', ()=>{ admin.editSlug=null; render(); }));
  document.querySelectorAll('[data-save]').forEach(el=>el.addEventListener('click', async ()=>{
    const slug=el.dataset.save, h=HEROES[slug];
    h.ar = document.getElementById('e_ar').value.trim() || h.ar;
    h.role = document.getElementById('e_role').value;
    h.lane = document.getElementById('e_lane').value.trim() || LANE_DEFAULT[h.role];
    h.tier = document.getElementById('e_tier').value || null;
    admin.editSlug=null; render();
    if(DB_ENABLED){
      const { error } = await sb.from('heroes').update({ar:h.ar, role:h.role, lane:h.lane, tier:h.tier}).eq('slug', slug);
      if(error) alert('حُفظ محلياً لكن فشل الحفظ في قاعدة البيانات: '+error.message);
    }
  }));
  document.querySelectorAll('[data-img]').forEach(el=>el.addEventListener('click', async ()=>{
    const slug=el.dataset.img, h=HEROES[slug];
    const url=prompt(`رابط صورة ${h.ar} (اتركه فارغاً لحذف الصورة والعودة للحرف الافتراضي):`, h.img||'');
    if(url===null) return;
    if(url.trim()) h.img=url.trim(); else delete h.img;
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('heroes').update({img: h.img||null}).eq('slug', slug);
      if(error) alert('حُفظت الصورة محلياً لكن فشل الحفظ في قاعدة البيانات: '+error.message);
    }
  }));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click', async ()=>{
    const slug=el.dataset.del;
    if(!confirm(`حذف ${HEROES[slug].ar} نهائياً${DB_ENABLED?' من قاعدة البيانات':' من هذه الجلسة'}؟`)) return;
    delete HEROES[slug];
    for(let i=COUNTERS.length-1;i>=0;i--) if(COUNTERS[i][0]===slug||COUNTERS[i][1]===slug) COUNTERS.splice(i,1);
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('heroes').delete().eq('slug', slug);
      if(error) alert('حُذف محلياً لكن فشل الحذف من قاعدة البيانات: '+error.message);
    }
  }));

  const cSearch = document.getElementById('cSearch');
  if(cSearch) cSearch.addEventListener('input', ()=>{ admin.counterSearch = cSearch.value; render(); });

  const addCounterBtn = document.getElementById('addCounterBtn');
  if(addCounterBtn) addCounterBtn.addEventListener('click', async ()=>{
    const subject = document.getElementById('cSubject').value;
    const counter = document.getElementById('cCounter').value;
    const score = Math.max(1, Math.min(100, +document.getElementById('cScore').value || 60));
    const deltaRaw = document.getElementById('cDelta').value.trim();
    const delta = deltaRaw? parseFloat(deltaRaw) : null;
    const reason = document.getElementById('cReason').value.trim();
    if(subject===counter){ alert('يجب أن يكون البطلان مختلفَين.'); return; }
    if(!reason){ alert('اكتب سبباً مختصراً.'); return; }
    if(COUNTERS.some(c=>c[0]===subject && c[1]===counter)){ alert('هذه المواجهة مُضافة مسبقاً — عدّلها من القائمة أدناه بدل إضافتها من جديد.'); return; }
    COUNTERS.push([subject, counter, score, delta, reason]);
    admin.counterMsg = `أُضيف: ${HEROES[counter].ar} يقهر ${HEROES[subject].ar} ✓`;
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('counters').insert({subject, counter, score, delta, reason});
      if(error) alert('أُضيف محلياً لكن فشل الحفظ في قاعدة البيانات: '+error.message);
    }
  });

  document.querySelectorAll('[data-cedit]').forEach(el=>el.addEventListener('click', ()=>{ admin.editCounterIdx=+el.dataset.cedit; render(); }));
  document.querySelectorAll('[data-ccancel]').forEach(el=>el.addEventListener('click', ()=>{ admin.editCounterIdx=null; render(); }));
  document.querySelectorAll('[data-csave]').forEach(el=>el.addEventListener('click', async ()=>{
    const i=+el.dataset.csave, c=COUNTERS[i];
    const [subject, counter] = c;
    c[2] = Math.max(1, Math.min(100, +document.getElementById('ec_score').value || c[2]));
    const deltaRaw = document.getElementById('ec_delta').value.trim();
    c[3] = deltaRaw? parseFloat(deltaRaw) : null;
    c[4] = document.getElementById('ec_reason').value.trim() || c[4];
    admin.editCounterIdx = null;
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('counters').update({score:c[2], delta:c[3], reason:c[4]})
        .eq('subject', subject).eq('counter', counter);
      if(error) alert('حُفظ محلياً لكن فشل الحفظ في قاعدة البيانات: '+error.message);
    }
  }));
  document.querySelectorAll('[data-cdel]').forEach(el=>el.addEventListener('click', async ()=>{
    const i=+el.dataset.cdel, c=COUNTERS[i];
    if(!confirm(`حذف مواجهة "${HEROES[c[1]].ar} يقهر ${HEROES[c[0]].ar}" نهائياً؟`)) return;
    const [subject, counter] = c;
    COUNTERS.splice(i,1);
    render();
    if(DB_ENABLED){
      const { error } = await sb.from('counters').delete().eq('subject', subject).eq('counter', counter);
      if(error) alert('حُذف محلياً لكن فشل الحذف من قاعدة البيانات: '+error.message);
    }
  }));
}

    });

  document.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click', ()=>{
    const [team,idxStr]=el.dataset.slot.split(':'); const idx=+idxStr;
    const arr = team==='a'? teamA : teamB;
    if(arr[idx]){ arr[idx]=null; compareResult=null; render(); }
    else { picking={team,idx}; render(); }
  }));
  document.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click', ()=>{
    const arr = picking.team==='a'? teamA : teamB;
    arr[picking.idx]=el.dataset.pick; picking=null; compareResult=null; render();
  }));
  const pq = document.getElementById('pq');
  if(pq) pq.addEventListener('input', ()=>{
    const v=pq.value.trim().toLowerCase();
    document.querySelectorAll('#pgrid .hcard').forEach(el=>{
      const slug=el.dataset.pick;
      el.style.display = (!v || slug.includes(v) || HEROES[slug].ar.includes(v))? '':'none';
    });
  });
  const findBtn = document.getElementById('findBtn');
  if(findBtn) findBtn.addEventListener('click', ()=>{
    compareResult = compareTeams(teamA, teamB);
    render();
    const els=document.querySelectorAll('.eyebrow'); if(els.length) els[els.length-1].scrollIntoView({behavior:'smooth'});
  });

  bindAdmin();
}

/* ══════════════════════════════════════════════════════════════
   الإقلاع — يحاول القراءة من Supabase أولاً، ويرجع للبيانات المحلية
   الجاهزة أعلاه إن لم تُفعَّل قاعدة البيانات أو تعذّر الاتصال
   ══════════════════════════════════════════════════════════════ */
async function loadFromDB(){
  if(!DB_ENABLED) return;
  try{
    const { data: heroRows, error: e1 } = await sb.from('heroes').select('*');
    if(e1) throw e1;
    const { data: counterRows, error: e2 } = await sb.from('counters').select('*');
    if(e2) throw e2;
    if(heroRows && heroRows.length){
      const fresh = {};
      heroRows.forEach(r=>{
        fresh[r.slug] = {
          ar:r.ar, role:r.role, lane:r.lane, tier:r.tier||null, img:r.img||null, pop:r.pop||34,
          overview:r.overview||undefined, notes:r.notes||undefined,
          combos:r.combos||undefined, skillOrder:r.skill_order||undefined, build:r.build||undefined,
        };
      });
      Object.keys(HEROES).forEach(k=>delete HEROES[k]);
      Object.assign(HEROES, fresh);
    }
    if(counterRows){
      COUNTERS.length = 0;
      counterRows.forEach(r=> COUNTERS.push([r.subject, r.counter, r.score, r.delta, r.reason]));
    }
  }catch(err){
    console.warn('تعذّر الاتصال بقاعدة البيانات — يعمل الموقع بالبيانات المحلية.', err);
  }
}

(async function boot(){
  await loadFromDB();
  render();
})();
</script>
